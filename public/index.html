<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GlobalBridge Mock 은행 — Admin / API Tester</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root, :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a;
    --fg: #e6e8ee; --mute: #8b93a3;
    --krw: #5aa9ff; --vnd: #f4a261; --php: #b18cf3; --usd: #6bd49a;
    --ok: #4ade80; --err: #f87171;
    --btn: #2a2f3a; --btnh: #353b48;
    --code-bg: #0f1115; --input-bg: #0f1115;
    --flash: #243a2a;
    --ccy-krw-bg: rgba(90,169,255,0.15);
    --ccy-vnd-bg: rgba(244,162,97,0.15);
    --ccy-php-bg: rgba(177,140,243,0.15);
    --ccy-usd-bg: rgba(107,212,154,0.15);
    --primary-bg: #1e3a5f; --primary-bd: #2a4a73; --primary-bgh: #284a73;
    --danger-bg: #3a1e1e; --danger-bd: #5a2a2a; --danger-bgh: #4a2828;
    --pill-bg: #1f2430;
    --pill-ok-bg: #14361f;
    --pill-err-bg: #3a1414;
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --panel: #ffffff; --line: #e3e6ec;
    --fg: #1a1d24; --mute: #6b7280;
    --krw: #2563eb; --vnd: #c2410c; --php: #7c3aed; --usd: #15803d;
    --ok: #15803d; --err: #b91c1c;
    --btn: #eef0f4; --btnh: #dde1e8;
    --code-bg: #f1f3f7; --input-bg: #ffffff;
    --flash: #c9efd4;
    --ccy-krw-bg: rgba(37,99,235,0.10);
    --ccy-vnd-bg: rgba(194,65,12,0.10);
    --ccy-php-bg: rgba(124,58,237,0.10);
    --ccy-usd-bg: rgba(21,128,61,0.10);
    --primary-bg: #dbeafe; --primary-bd: #93c5fd; --primary-bgh: #bfdbfe;
    --danger-bg: #fee2e2; --danger-bd: #fca5a5; --danger-bgh: #fecaca;
    --pill-bg: #e5e7eb;
    --pill-ok-bg: #dcfce7;
    --pill-err-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    transition: background 0.15s, color 0.15s;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .meta { color: var(--mute); font-size: 12px; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; background: var(--pill-bg); color: var(--mute);
  }
  .pill.ok { background: var(--pill-ok-bg); color: var(--ok); }
  .pill.err { background: var(--pill-err-bg); color: var(--err); }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 0;
    height: calc(100vh - 61px);
  }
  .accounts { overflow-y: auto; padding: 16px 20px; }
  .accounts table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .accounts th, .accounts td {
    padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left;
    vertical-align: middle; white-space: nowrap;
  }
  .accounts th {
    color: var(--mute); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .accounts td.balance { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .accounts tr.flash td { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }

  .ccy { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
  .ccy.KRW { background: var(--ccy-krw-bg); color: var(--krw); }
  .ccy.VND { background: var(--ccy-vnd-bg); color: var(--vnd); }
  .ccy.PHP { background: var(--ccy-php-bg); color: var(--php); }
  .ccy.USD { background: var(--ccy-usd-bg); color: var(--usd); }

  .bank { font-weight: 600; }
  .bank-shinhan { color: var(--krw); }
  .bank-woori   { color: var(--krw); }
  .bank-kb      { color: var(--vnd); }
  .bank-quokka  { color: var(--vnd); }
  .bank-beaver  { color: var(--usd); }

  code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }

  button {
    background: var(--btn); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    margin-right: 4px; font-family: inherit;
  }
  button:hover { background: var(--btnh); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--primary-bg); border-color: var(--primary-bd); }
  button.primary:hover { background: var(--primary-bgh); }
  button.danger { background: var(--danger-bg); border-color: var(--danger-bd); }
  button.danger:hover { background: var(--danger-bgh); }

  .response {
    border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .response-head {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .response-head h2 { font-size: 13px; margin: 0; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.08em; }
  .response-body {
    flex: 1; overflow-y: auto; padding: 12px 16px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-all;
  }
  .response-body .log {
    border-bottom: 1px dashed var(--line); padding-bottom: 10px; margin-bottom: 10px;
  }
  .response-body .log:last-child { border-bottom: none; }
  .log-head { color: var(--mute); margin-bottom: 4px; font-size: 11px; }
  .log-head .method { color: var(--fg); font-weight: 600; }
  .log-head .ok { color: var(--ok); }
  .log-head .err { color: var(--err); }
  pre { margin: 0; font-family: inherit; }

  dialog {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; max-width: 400px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; font-size: 12px; color: var(--mute); margin: 10px 0 4px; }
  dialog input {
    width: 100%; padding: 8px 10px; background: var(--input-bg); border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; font: inherit;
  }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toolbar { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .toolbar .grow { flex: 1; }
  .hint { color: var(--mute); font-size: 11px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🏦 GlobalBridge Mock 은행 — API Tester</h1>
    <div class="meta">시드 계좌 8건. 각 행에서 직접 API 콜 가능. 결과는 우측 패널.</div>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <span id="health" class="pill">checking…</span>
    <span id="tls" class="pill"></span>
    <button id="themeToggle" title="테마 전환" aria-label="테마 전환">🌙</button>
  </div>
</header>

<main>
  <section class="accounts">
    <div class="toolbar">
      <button id="refresh" class="primary">↻ 잔액 새로고침</button>
      <span class="grow"></span>
      <span class="hint">행 잔액이 변하면 잠깐 초록색으로 깜빡입니다.</span>
    </div>

    <table>
      <thead>
        <tr>
          <th>은행</th>
          <th>계좌번호</th>
          <th>예금주</th>
          <th>통화</th>
          <th style="text-align:right">잔액</th>
          <th>액션</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <aside class="response">
    <div class="response-head">
      <h2>Response Log</h2>
      <button id="clear">Clear</button>
    </div>
    <div id="log" class="response-body"></div>
  </aside>
</main>

<dialog id="amountDialog">
  <h3 id="dialogTitle">금액 입력</h3>
  <div id="dialogSub" class="hint"></div>
  <label>금액</label>
  <input id="amountInput" type="text" placeholder="예: 100000">
  <div class="actions">
    <button id="cancelBtn">취소</button>
    <button id="confirmBtn" class="primary">실행</button>
  </div>
</dialog>

<script>
const API = '/api/v1/bank';
const $rows = document.getElementById('rows');
const $log = document.getElementById('log');
const $health = document.getElementById('health');
const $tls = document.getElementById('tls');
const $dialog = document.getElementById('amountDialog');
const $dlgTitle = document.getElementById('dialogTitle');
const $dlgSub = document.getElementById('dialogSub');
const $amount = document.getElementById('amountInput');

// 이전 잔액을 기억해두고 다음 새로고침에서 비교 (변한 행만 플래시)
let prevBalances = new Map();
// 인증으로 받은 토큰 캐시 (한 계좌당 1개. 출금 시 자동 사용)
const tokenCache = new Map();

function uuid() {
  return crypto.randomUUID();
}
function fmtMoney(s, currency) {
  const n = parseFloat(s);
  if (Number.isNaN(n)) return s;
  return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function rowKey(acc) { return acc.bank_code + '|' + acc.account_number; }

// 금융결제원 표준 숫자 코드(서버 SSOT) → 시각용 슬러그(CSS 클래스 이름)
// 숫자로 시작하는 클래스명은 CSS 셀렉터로 못 쓰므로 슬러그를 거쳐 칠한다.
const BANK_SLUG = {
  '004': 'kb',
  '088': 'shinhan',
  '020': 'woori',
  '900': 'beaver',
  '901': 'quokka',
};

async function call(method, path, body, extraHeaders) {
  const t0 = performance.now();
  const headers = { 'Content-Type': 'application/json', ...(extraHeaders || {}) };
  const opts = { method, headers };
  if (body !== undefined) opts.body = JSON.stringify(body);
  let json, status, err;
  try {
    const res = await fetch(path, opts);
    status = res.status;
    json = await res.json();
  } catch (e) {
    err = e;
  }
  const dt = (performance.now() - t0).toFixed(0);
  pushLog({ method, path, body, status, json, err, dt });
  return { status, json, err };
}

function pushLog({ method, path, body, status, json, err, dt }) {
  const entry = document.createElement('div');
  entry.className = 'log';
  const okFlag = !err && json && json.success;
  const cls = okFlag ? 'ok' : 'err';
  const head = document.createElement('div');
  head.className = 'log-head';
  head.innerHTML = `<span class="method">${method}</span> ${path}` +
    ` <span class="${cls}">[${err ? 'NET ERR' : status}]</span>` +
    ` <span style="float:right">${dt}ms</span>`;
  entry.appendChild(head);

  if (body !== undefined) {
    const pre = document.createElement('pre');
    pre.textContent = '→ ' + JSON.stringify(body, null, 2);
    pre.style.color = 'var(--mute)';
    entry.appendChild(pre);
  }
  const pre = document.createElement('pre');
  pre.textContent = err ? String(err) : JSON.stringify(json, null, 2);
  entry.appendChild(pre);

  $log.prepend(entry);
}

async function loadAccounts() {
  const res = await fetch('/admin/accounts');
  const data = await res.json();
  renderAccounts(data.data.accounts);
}

function renderAccounts(accounts) {
  $rows.innerHTML = '';
  for (const acc of accounts) {
    const tr = document.createElement('tr');
    const key = rowKey(acc);
    const prev = prevBalances.get(key);
    const flash = prev !== undefined && prev !== acc.balance;
    if (flash) tr.classList.add('flash');
    prevBalances.set(key, acc.balance);

    const isQuokka = acc.bank_code === '901' || acc.bank_code === '900';
    const slug = BANK_SLUG[acc.bank_code] || '';

    tr.innerHTML = `
      <td><span class="bank bank-${slug}">${acc.bank_code}</span></td>
      <td><code>${acc.account_number}</code></td>
      <td>${acc.holder_name}</td>
      <td><span class="ccy ${acc.currency_code}">${acc.currency_code}</span></td>
      <td class="balance">${fmtMoney(acc.balance, acc.currency_code)}</td>
      <td>
        <button data-action="inquiry">조회</button>
        ${isQuokka ? '' : '<button data-action="verify">인증</button>'}
        ${isQuokka ? '' : '<button data-action="withdrawal" class="danger">출금</button>'}
        ${isQuokka ? '<button data-action="payout" class="primary">지급</button>' : ''}
      </td>
    `;
    tr.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.action, acc));
    });
    $rows.appendChild(tr);
  }
}

async function handleAction(action, acc) {
  if (action === 'inquiry') {
    await call('POST', `${API}/accounts/inquiry`, {
      bank_code: acc.bank_code,
      account_number: acc.account_number,
    });
    return;
  }
  if (action === 'verify') {
    const r = await call('POST', `${API}/accounts/verify`, {
      bank_code: acc.bank_code,
      account_number: acc.account_number,
      holder_name: acc.holder_name,
    });
    if (r.json && r.json.success) {
      tokenCache.set(rowKey(acc), r.json.data.account_token);
    }
    return;
  }
  if (action === 'withdrawal') {
    let token = tokenCache.get(rowKey(acc));
    if (!token) {
      const r = await call('POST', `${API}/accounts/verify`, {
        bank_code: acc.bank_code,
        account_number: acc.account_number,
        holder_name: acc.holder_name,
      });
      if (!(r.json && r.json.success)) return;
      token = r.json.data.account_token;
      tokenCache.set(rowKey(acc), token);
    }
    const amount = await askAmount(`출금 — ${acc.bank_code} ${acc.account_number}`,
      `${acc.holder_name} / ${acc.currency_code} 잔액: ${fmtMoney(acc.balance)}`);
    if (!amount) return;
    await call('POST', `${API}/transfers/withdrawal`, {
      account_token: token,
      amount,
      currency_code: acc.currency_code,
    }, { 'Idempotency-Key': uuid() });
    await loadAccounts();
    return;
  }
  if (action === 'payout') {
    const amount = await askAmount(`지급 — ${acc.bank_code} ${acc.account_number}`,
      `${acc.holder_name} / ${acc.currency_code} 현재잔액: ${fmtMoney(acc.balance)}`);
    if (!amount) return;
    await call('POST', `${API}/transfers/payout`, {
      bank_code: acc.bank_code,
      account_number: acc.account_number,
      amount,
      currency_code: acc.currency_code,
    }, { 'Idempotency-Key': uuid() });
    await loadAccounts();
    return;
  }
}

// 금액 입력 다이얼로그. resolve(amount문자열) | resolve(null) (취소)
function askAmount(title, sub) {
  return new Promise(resolve => {
    $dlgTitle.textContent = title;
    $dlgSub.textContent = sub || '';
    $amount.value = '';
    $dialog.showModal();
    $amount.focus();
    const onCancel = () => { cleanup(); resolve(null); };
    const onConfirm = () => {
      const v = $amount.value.trim();
      if (!v) return;
      cleanup(); resolve(v);
    };
    const onKey = (e) => { if (e.key === 'Enter') onConfirm(); };
    function cleanup() {
      $dialog.close();
      document.getElementById('cancelBtn').removeEventListener('click', onCancel);
      document.getElementById('confirmBtn').removeEventListener('click', onConfirm);
      $amount.removeEventListener('keydown', onKey);
    }
    document.getElementById('cancelBtn').addEventListener('click', onCancel);
    document.getElementById('confirmBtn').addEventListener('click', onConfirm);
    $amount.addEventListener('keydown', onKey);
  });
}

async function checkHealth() {
  try {
    const res = await fetch('/health');
    const j = await res.json();
    if (j.success) {
      $health.textContent = 'UP';
      $health.className = 'pill ok';
      $tls.textContent = j.data.tls ? 'mTLS ON' : 'HTTP (no TLS)';
      $tls.className = 'pill';
    } else {
      $health.textContent = 'DOWN';
      $health.className = 'pill err';
    }
  } catch (e) {
    $health.textContent = 'DOWN';
    $health.className = 'pill err';
  }
}

document.getElementById('refresh').addEventListener('click', loadAccounts);
document.getElementById('clear').addEventListener('click', () => { $log.innerHTML = ''; });

// 테마 토글: localStorage에 저장, 없으면 OS 설정 따라감
const $theme = document.getElementById('themeToggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $theme.textContent = t === 'dark' ? '☀️' : '🌙';
}
const saved = localStorage.getItem('theme');
const initial = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
applyTheme(initial);
$theme.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

checkHealth();
loadAccounts();
</script>
</body>
</html>
