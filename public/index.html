<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GlobalBridge Mock Bank — Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg:#0f1115;--panel:#181b22;--line:#2a2f3a;
    --fg:#e6e8ee;--mute:#8b93a3;
    --krw:#5aa9ff;--vnd:#f4a261;--php:#b18cf3;--usd:#6bd49a;
    --ok:#4ade80;--err:#f87171;--warn:#fbbf24;
    --btn:#2a2f3a;--btnh:#353b48;
    --code-bg:#0f1115;--input-bg:#0f1115;
    --flash:#243a2a;
    --ccy-krw-bg:rgba(90,169,255,.15);--ccy-vnd-bg:rgba(244,162,97,.15);
    --ccy-php-bg:rgba(177,140,243,.15);--ccy-usd-bg:rgba(107,212,154,.15);
    --primary-bg:#1e3a5f;--primary-bd:#2a4a73;--primary-bgh:#284a73;
    --danger-bg:#3a1e1e;--danger-bd:#5a2a2a;--danger-bgh:#4a2828;
    --pill-bg:#1f2430;--pill-ok-bg:#14361f;--pill-err-bg:#3a1414;--pill-warn-bg:#3a2e14;
  }
  :root[data-theme="light"] {
    --bg:#f7f8fa;--panel:#fff;--line:#e3e6ec;
    --fg:#1a1d24;--mute:#6b7280;
    --krw:#2563eb;--vnd:#c2410c;--php:#7c3aed;--usd:#15803d;
    --ok:#15803d;--err:#b91c1c;--warn:#b45309;
    --btn:#eef0f4;--btnh:#dde1e8;
    --code-bg:#f1f3f7;--input-bg:#fff;
    --flash:#c9efd4;
    --ccy-krw-bg:rgba(37,99,235,.10);--ccy-vnd-bg:rgba(194,65,12,.10);
    --ccy-php-bg:rgba(124,58,237,.10);--ccy-usd-bg:rgba(21,128,61,.10);
    --primary-bg:#dbeafe;--primary-bd:#93c5fd;--primary-bgh:#bfdbfe;
    --danger-bg:#fee2e2;--danger-bd:#fca5a5;--danger-bgh:#fecaca;
    --pill-bg:#e5e7eb;--pill-ok-bg:#dcfce7;--pill-err-bg:#fee2e2;--pill-warn-bg:#fef3c7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Pretendard",sans-serif;transition:background .15s,color .15s;}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  header .meta{color:var(--mute);font-size:11px;}
  .pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--pill-bg);color:var(--mute);}
  .pill.ok{background:var(--pill-ok-bg);color:var(--ok);}
  .pill.err{background:var(--pill-err-bg);color:var(--err);}
  .pill.warn{background:var(--pill-warn-bg);color:var(--warn);}

  main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;height:calc(100vh - 57px);}
  .left{overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;}

  /* ── 인증 대기 패널 ── */
  .pv-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .pv-head{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .pv-head h3{margin:0;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;}
  .pv-body{padding:10px 12px;}
  .pv-empty{color:var(--mute);font-size:12px;padding:6px 0;}
  .pv-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px;}
  .pv-item:last-child{border-bottom:none;}
  .pv-code{font-family:ui-monospace,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--warn);background:var(--pill-warn-bg);padding:3px 10px;border-radius:6px;min-width:72px;text-align:center;}
  .pv-info{flex:1;line-height:1.4;}
  .pv-info .acct{font-weight:600;}
  .pv-info .bank{color:var(--mute);font-size:11px;}
  .pv-timer{font-size:11px;color:var(--mute);text-align:right;min-width:52px;}
  .pv-timer.urgent{color:var(--warn);}

  /* ── 계좌 테이블 ── */
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;}
  th{color:var(--mute);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
  td.balance{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  tr.flash td{animation:flash 1.2s ease-out;}
  @keyframes flash{from{background:var(--flash);}to{background:transparent;}}

  .ccy{font-size:10px;padding:1px 5px;border-radius:4px;margin-right:3px;}
  .ccy.KRW{background:var(--ccy-krw-bg);color:var(--krw);}
  .ccy.VND{background:var(--ccy-vnd-bg);color:var(--vnd);}
  .ccy.PHP{background:var(--ccy-php-bg);color:var(--php);}
  .ccy.USD{background:var(--ccy-usd-bg);color:var(--usd);}

  .bank-name{font-size:11px;color:var(--mute);}
  .bank-code{font-weight:600;font-size:12px;}
  code{background:var(--code-bg);padding:1px 4px;border-radius:3px;font-size:11px;}

  button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;margin-right:3px;font-family:inherit;}
  button:hover{background:var(--btnh);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--primary-bg);border-color:var(--primary-bd);}
  button.primary:hover{background:var(--primary-bgh);}
  button.danger{background:var(--danger-bg);border-color:var(--danger-bd);}
  button.danger:hover{background:var(--danger-bgh);}
  button.warn{background:var(--pill-warn-bg);border-color:var(--warn);color:var(--warn);}

  /* ── 우측 패널 ── */
  .right{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;}
  .right-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .right-head h2{font-size:11px;margin:0;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;}
  .right-body{flex:1;overflow-y:auto;padding:10px 14px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-all;}
  .log{border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px;}
  .log:last-child{border-bottom:none;}
  .log-head{color:var(--mute);margin-bottom:3px;font-size:10px;}
  .log-head .method{color:var(--fg);font-weight:600;}
  .log-head .ok{color:var(--ok);}
  .log-head .err{color:var(--err);}
  pre{margin:0;font-family:inherit;}

  /* ── 거래내역 패널 (우측) ── */
  .tx-panel{padding:10px 14px;}
  .tx-panel h3{font-size:12px;margin:0 0 10px;font-weight:600;}
  .tx-item{border-bottom:1px dashed var(--line);padding:7px 0;font-size:11px;line-height:1.5;}
  .tx-item:last-child{border-bottom:none;}
  .tx-kind{font-weight:600;margin-right:6px;}
  .tx-kind.VERIFY_DEPOSIT{color:var(--warn);}
  .tx-kind.WITHDRAWAL{color:var(--err);}
  .tx-kind.PAYOUT{color:var(--ok);}
  .tx-memo{font-family:ui-monospace,Consolas,monospace;background:var(--pill-warn-bg);color:var(--warn);padding:1px 6px;border-radius:4px;margin-top:2px;display:inline-block;}
  .tx-amt{font-variant-numeric:tabular-nums;font-weight:600;}
  .tx-date{color:var(--mute);font-size:10px;}

  /* ── 다이얼로그 ── */
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:380px;width:92%;}
  dialog::backdrop{background:rgba(0,0,0,.6);}
  dialog h3{margin:0 0 10px;font-size:14px;}
  dialog label{display:block;font-size:11px;color:var(--mute);margin:8px 0 3px;}
  dialog input{width:100%;padding:7px 9px;background:var(--input-bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;font:inherit;}
  dialog input.otp{font-size:28px;letter-spacing:.25em;text-align:center;font-family:ui-monospace,Consolas,monospace;font-weight:700;}
  dialog .hint{font-size:11px;color:var(--mute);margin:4px 0 8px;}
  dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

  .toolbar{display:flex;gap:8px;align-items:center;}
  .toolbar .grow{flex:1;}
  .section-title{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>🏦 GlobalBridge Mock Bank</h1>
    <div class="meta">KR · US · VN · PH 파트너 은행 시뮬레이터 — 계좌 조회/인증/출금/지급 API 테스터</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="health" class="pill">checking…</span>
    <span id="tls" class="pill"></span>
    <button id="themeToggle" title="테마 전환">🌙</button>
  </div>
</header>

<main>
  <section class="left">

    <!-- 인증 대기 패널 -->
    <div class="pv-panel" id="pvPanel">
      <div class="pv-head" id="pvToggle">
        <h3>⏳ 인증 대기 <span id="pvCount" class="pill" style="margin-left:6px">0</span></h3>
        <span style="font-size:11px;color:var(--mute)" id="pvChevron">▼</span>
      </div>
      <div class="pv-body" id="pvBody">
        <div class="pv-empty">현재 인증 대기 중인 코드가 없습니다.</div>
      </div>
    </div>

    <!-- 계좌 테이블 -->
    <div>
      <div class="toolbar" style="margin-bottom:10px;">
        <button id="refresh" class="primary">↻ 새로고침</button>
        <span class="grow"></span>
        <span style="font-size:11px;color:var(--mute);" id="lastRefresh"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>은행</th>
            <th>계좌번호</th>
            <th>예금주</th>
            <th>통화</th>
            <th style="text-align:right">잔액</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <aside class="right">
    <div class="right-head">
      <h2 id="rightTitle">Response Log</h2>
      <div>
        <button id="clearLog">Clear</button>
        <button id="showLog" style="display:none">로그 보기</button>
      </div>
    </div>
    <div id="rightContent">
      <div id="log" class="right-body"></div>
    </div>
  </aside>
</main>

<!-- 금액 입력 다이얼로그 -->
<dialog id="amountDialog">
  <h3 id="dlgAmtTitle">금액 입력</h3>
  <div id="dlgAmtSub" class="hint"></div>
  <label>금액</label>
  <input id="amountInput" type="text" placeholder="예: 100000">
  <div class="actions">
    <button id="cancelAmt">취소</button>
    <button id="confirmAmt" class="primary">실행</button>
  </div>
</dialog>

<!-- OTP 입력 다이얼로그 -->
<dialog id="otpDialog">
  <h3>인증번호 입력</h3>
  <div id="dlgOtpSub" class="hint"></div>
  <label>입금 적요에 표시된 인증번호 4자리</label>
  <input id="otpInput" class="otp" type="text" maxlength="4" placeholder="0000" inputmode="numeric">
  <div class="hint" id="otpExpiry"></div>
  <div class="actions">
    <button id="cancelOtp">취소</button>
    <button id="confirmOtp" class="primary">확인</button>
  </div>
</dialog>

<script>
const API = '/api/v1/bank';
const $rows = document.getElementById('rows');
const $log = document.getElementById('log');
const $health = document.getElementById('health');
const $tls = document.getElementById('tls');
const $pvBody = document.getElementById('pvBody');
const $pvCount = document.getElementById('pvCount');

let prevBalances = new Map();
const tokenCache = new Map();   // rowKey → account_token
const pendingVerify = new Map(); // rowKey → { expires_at }

// ── 은행 메타데이터 SSOT ──
const BANK_META = {
  '004': { name: 'KB국민은행',      country: 'KR', flag: '🇰🇷' },
  '088': { name: '신한은행',        country: 'KR', flag: '🇰🇷' },
  '020': { name: '우리은행',        country: 'KR', flag: '🇰🇷' },
  '081': { name: '하나은행',        country: 'KR', flag: '🇰🇷' },
  '011': { name: 'NH농협은행',      country: 'KR', flag: '🇰🇷' },
  'WF':  { name: 'Wells Fargo',     country: 'US', flag: '🇺🇸' },
  'BOA': { name: 'Bank of America', country: 'US', flag: '🇺🇸' },
  'JPM': { name: 'Chase',           country: 'US', flag: '🇺🇸' },
  'C':   { name: 'Citibank',        country: 'US', flag: '🇺🇸' },
  'VCB': { name: 'Vietcombank',     country: 'VN', flag: '🇻🇳' },
  'BIDV':{ name: 'BIDV',            country: 'VN', flag: '🇻🇳' },
  'ICB': { name: 'VietinBank',      country: 'VN', flag: '🇻🇳' },
  'TCB': { name: 'Techcombank',     country: 'VN', flag: '🇻🇳' },
  'BDO': { name: 'BDO Unibank',     country: 'PH', flag: '🇵🇭' },
  'BPI': { name: 'BPI',             country: 'PH', flag: '🇵🇭' },
  'MBT': { name: 'Metrobank',       country: 'PH', flag: '🇵🇭' },
  'UBP': { name: 'UnionBank',       country: 'PH', flag: '🇵🇭' },
};
function bankLabel(code) {
  const m = BANK_META[code];
  return m ? `${m.flag} ${m.name}` : code;
}
function bankMini(code) {
  const m = BANK_META[code];
  return m ? `<span class="bank-code">${code}</span><br><span class="bank-name">${m.flag} ${m.name}</span>` : `<span class="bank-code">${code}</span>`;
}

function uuid() { return crypto.randomUUID(); }
function rowKey(acc) { return acc.bank_code + '|' + acc.account_number; }
function fmtMoney(s) {
  const n = parseFloat(s);
  return isNaN(n) ? s : n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function secsLeft(iso) {
  return Math.max(0, Math.floor((new Date(iso) - Date.now()) / 1000));
}

// ── API call ──
async function call(method, path, body, extraHeaders) {
  const t0 = performance.now();
  const headers = { 'Content-Type': 'application/json', ...(extraHeaders || {}) };
  const opts = { method, headers };
  if (body !== undefined) opts.body = JSON.stringify(body);
  let json, status, err;
  try {
    const res = await fetch(path, opts);
    status = res.status;
    json = await res.json();
  } catch (e) { err = e; }
  pushLog({ method, path, body, status, json, err, dt: (performance.now() - t0).toFixed(0) });
  return { status, json, err };
}

function pushLog({ method, path, body, status, json, err, dt }) {
  const entry = document.createElement('div');
  entry.className = 'log';
  const ok = !err && json && json.success;
  const head = document.createElement('div');
  head.className = 'log-head';
  head.innerHTML = `<span class="method">${method}</span> ${path}` +
    ` <span class="${ok ? 'ok' : 'err'}">[${err ? 'NET' : status}]</span>` +
    ` <span style="float:right">${dt}ms</span>`;
  entry.appendChild(head);
  if (body !== undefined) {
    const pre = document.createElement('pre');
    pre.textContent = '→ ' + JSON.stringify(body, null, 2);
    pre.style.color = 'var(--mute)';
    entry.appendChild(pre);
  }
  const pre = document.createElement('pre');
  pre.textContent = err ? String(err) : JSON.stringify(json, null, 2);
  entry.appendChild(pre);
  $log.prepend(entry);
}

// ── 계좌 로드 ──
async function loadAccounts() {
  const res = await fetch('/admin/accounts');
  const data = await res.json();
  renderAccounts(data.data.accounts);
  document.getElementById('lastRefresh').textContent = '마지막 갱신: ' + fmtTime(new Date().toISOString());
}

function renderAccounts(accounts) {
  $rows.innerHTML = '';
  for (const acc of accounts) {
    const tr = document.createElement('tr');
    const key = rowKey(acc);
    const prev = prevBalances.get(key);
    if (prev !== undefined && prev !== acc.balance) tr.classList.add('flash');
    prevBalances.set(key, acc.balance);

    const hasPending = pendingVerify.has(key);
    const hasToken = tokenCache.has(key);

    tr.innerHTML = `
      <td>${bankMini(acc.bank_code)}</td>
      <td><code>${acc.account_number}</code></td>
      <td style="white-space:nowrap">${acc.holder_name}</td>
      <td><span class="ccy ${acc.currency_code}">${acc.currency_code}</span></td>
      <td class="balance">${fmtMoney(acc.balance)}</td>
      <td style="white-space:nowrap">
        <button data-action="txns" title="거래내역">📋</button>
        <button data-action="inquiry">조회</button>
        ${hasToken
          ? `<button data-action="withdrawal" class="danger">출금</button>`
          : hasPending
            ? `<button data-action="confirm" class="warn">인증확인</button>`
            : `<button data-action="verify" class="primary">인증시작</button>`}
        <button data-action="payout">지급</button>
      </td>
    `;
    tr.querySelectorAll('button[data-action]').forEach(btn =>
      btn.addEventListener('click', () => handleAction(btn.dataset.action, acc))
    );
    $rows.appendChild(tr);
  }
}

// ── 액션 핸들러 ──
async function handleAction(action, acc) {
  const key = rowKey(acc);

  if (action === 'inquiry') {
    await call('POST', `${API}/accounts/inquiry`, { bank_code: acc.bank_code, account_number: acc.account_number });
    return;
  }

  if (action === 'verify') {
    const r = await call('POST', `${API}/accounts/verify`, {
      bank_code: acc.bank_code, account_number: acc.account_number, holder_name: acc.holder_name
    });
    if (r.json && r.json.success && r.json.data.pending) {
      pendingVerify.set(key, { expires_at: r.json.data.expires_at });
      await loadAccounts();
      await loadPendingVerifications();
    }
    return;
  }

  if (action === 'confirm') {
    const pv = pendingVerify.get(key);
    const expiryInfo = pv ? `만료: ${fmtTime(pv.expires_at)} (${secsLeft(pv.expires_at)}초 남음)` : '';
    const code = await askOtp(
      `${bankLabel(acc.bank_code)} ${acc.account_number}`,
      expiryInfo
    );
    if (!code) return;
    const r = await call('POST', `${API}/accounts/confirm`, {
      bank_code: acc.bank_code, account_number: acc.account_number, code
    });
    if (r.json && r.json.success) {
      tokenCache.set(key, r.json.data.account_token);
      pendingVerify.delete(key);
      await loadAccounts();
      await loadPendingVerifications();
    }
    return;
  }

  if (action === 'withdrawal') {
    const token = tokenCache.get(key);
    if (!token) { alert('먼저 인증을 완료해주세요.'); return; }
    const amount = await askAmount(
      `출금 — ${bankLabel(acc.bank_code)}`,
      `${acc.holder_name} / ${acc.currency_code} 잔액: ${fmtMoney(acc.balance)}`
    );
    if (!amount) return;
    await call('POST', `${API}/transfers/withdrawal`,
      { account_token: token, amount, currency_code: acc.currency_code },
      { 'Idempotency-Key': uuid() });
    tokenCache.delete(key);
    await loadAccounts();
    return;
  }

  if (action === 'payout') {
    const amount = await askAmount(
      `지급 — ${bankLabel(acc.bank_code)}`,
      `${acc.holder_name} / ${acc.currency_code} 현재잔액: ${fmtMoney(acc.balance)}`
    );
    if (!amount) return;
    await call('POST', `${API}/transfers/payout`,
      { bank_code: acc.bank_code, account_number: acc.account_number, amount, currency_code: acc.currency_code },
      { 'Idempotency-Key': uuid() });
    await loadAccounts();
    return;
  }

  if (action === 'txns') {
    showTransactions(acc);
    return;
  }
}

// ── 거래 내역 패널 ──
async function showTransactions(acc) {
  const res = await fetch(`/admin/transactions?bankCode=${encodeURIComponent(acc.bank_code)}&accountNumber=${encodeURIComponent(acc.account_number)}`);
  const data = await res.json();
  const txns = data.data && data.data.transactions ? data.data.transactions : [];

  document.getElementById('rightTitle').textContent = `거래내역 — ${acc.holder_name}`;
  document.getElementById('showLog').style.display = '';
  const rc = document.getElementById('rightContent');
  rc.innerHTML = '';

  const div = document.createElement('div');
  div.className = 'tx-panel';

  const meta = `<div style="font-size:11px;color:var(--mute);margin-bottom:10px;">${bankLabel(acc.bank_code)} | <code>${acc.account_number}</code> | <span class="ccy ${acc.currency_code}" style="font-size:10px;">${acc.currency_code}</span> 잔액 <strong>${fmtMoney(acc.balance)}</strong></div>`;

  if (txns.length === 0) {
    div.innerHTML = `<h3>최근 거래 내역</h3>${meta}<div style="color:var(--mute);font-size:12px;">거래 내역이 없습니다.</div>`;
  } else {
    div.innerHTML = `<h3>최근 거래 내역 (${txns.length}건)</h3>${meta}` +
      txns.map(tx => {
        const sign = tx.kind === 'WITHDRAWAL' ? '−' : '+';
        const memoHtml = tx.memo
          ? `<div><span class="tx-memo">${escHtml(tx.memo)}</span></div>`
          : '';
        return `<div class="tx-item">
          <span class="tx-kind ${tx.kind}">${tx.kind}</span>
          <span class="tx-amt">${sign}${fmtMoney(tx.amount)} ${tx.currency_code}</span>
          <span class="tx-date" style="float:right">${fmtTime(tx.created_at)}</span>
          ${memoHtml}
          <div style="color:var(--mute);font-size:10px;">잔액 → ${fmtMoney(tx.balance_after)} ${tx.currency_code}</div>
        </div>`;
      }).join('');
  }
  rc.appendChild(div);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 로그로 돌아가기
document.getElementById('showLog').addEventListener('click', () => {
  document.getElementById('rightTitle').textContent = 'Response Log';
  document.getElementById('showLog').style.display = 'none';
  const rc = document.getElementById('rightContent');
  rc.innerHTML = '';
  rc.appendChild($log);
});

// ── 인증 대기 목록 ──
async function loadPendingVerifications() {
  const res = await fetch('/admin/pending-verifications');
  const data = await res.json();
  const items = data.data && data.data.pending ? data.data.pending : [];
  $pvCount.textContent = items.length;
  $pvCount.className = 'pill' + (items.length > 0 ? ' warn' : '');

  if (items.length === 0) {
    $pvBody.innerHTML = '<div class="pv-empty">현재 인증 대기 중인 코드가 없습니다.</div>';
    return;
  }
  $pvBody.innerHTML = items.map(pv => {
    const secs = secsLeft(pv.expires_at);
    const urgent = secs < 60;
    return `<div class="pv-item">
      <div class="pv-code">${pv.code}</div>
      <div class="pv-info">
        <div class="acct">${escHtml(pv.holder_name)}</div>
        <div class="bank">${bankLabel(pv.bank_code)} <code>${pv.account_number}</code></div>
      </div>
      <div class="pv-timer ${urgent ? 'urgent' : ''}" data-expires="${pv.expires_at}">${urgent ? '⚠ ' : ''}${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div>
    </div>`;
  }).join('');
}

// 타이머 tick
setInterval(() => {
  document.querySelectorAll('.pv-timer[data-expires]').forEach(el => {
    const secs = secsLeft(el.dataset.expires);
    el.textContent = (secs < 60 ? '⚠ ' : '') + Math.floor(secs/60) + ':' + String(secs%60).padStart(2,'0');
    el.className = 'pv-timer' + (secs < 60 ? ' urgent' : '');
  });
}, 1000);

// 5초마다 인증 대기 자동 폴링
setInterval(loadPendingVerifications, 5000);

// pv panel 토글
let pvOpen = true;
document.getElementById('pvToggle').addEventListener('click', () => {
  pvOpen = !pvOpen;
  $pvBody.style.display = pvOpen ? '' : 'none';
  document.getElementById('pvChevron').textContent = pvOpen ? '▼' : '▶';
});

// ── 다이얼로그 헬퍼 ──
function askAmount(title, sub) {
  return new Promise(resolve => {
    document.getElementById('dlgAmtTitle').textContent = title;
    document.getElementById('dlgAmtSub').textContent = sub || '';
    const $inp = document.getElementById('amountInput');
    $inp.value = '';
    const dlg = document.getElementById('amountDialog');
    dlg.showModal(); $inp.focus();
    const cancel = () => { cleanup(); resolve(null); };
    const confirm = () => { const v = $inp.value.trim(); if (!v) return; cleanup(); resolve(v); };
    const onKey = e => { if (e.key === 'Enter') confirm(); };
    function cleanup() {
      dlg.close();
      document.getElementById('cancelAmt').removeEventListener('click', cancel);
      document.getElementById('confirmAmt').removeEventListener('click', confirm);
      $inp.removeEventListener('keydown', onKey);
    }
    document.getElementById('cancelAmt').addEventListener('click', cancel);
    document.getElementById('confirmAmt').addEventListener('click', confirm);
    $inp.addEventListener('keydown', onKey);
  });
}

function askOtp(sub, expiry) {
  return new Promise(resolve => {
    document.getElementById('dlgOtpSub').textContent = sub || '';
    document.getElementById('otpExpiry').textContent = expiry || '';
    const $inp = document.getElementById('otpInput');
    $inp.value = '';
    const dlg = document.getElementById('otpDialog');
    dlg.showModal(); $inp.focus();
    const cancel = () => { cleanup(); resolve(null); };
    const confirm = () => {
      const v = $inp.value.trim();
      if (!/^\d{4}$/.test(v)) { $inp.select(); return; }
      cleanup(); resolve(v);
    };
    const onKey = e => { if (e.key === 'Enter') confirm(); };
    function cleanup() {
      dlg.close();
      document.getElementById('cancelOtp').removeEventListener('click', cancel);
      document.getElementById('confirmOtp').removeEventListener('click', confirm);
      $inp.removeEventListener('keydown', onKey);
    }
    document.getElementById('cancelOtp').addEventListener('click', cancel);
    document.getElementById('confirmOtp').addEventListener('click', confirm);
    $inp.addEventListener('keydown', onKey);
  });
}

// ── 헬스 체크 ──
async function checkHealth() {
  try {
    const j = await fetch('/health').then(r => r.json());
    if (j.success) {
      $health.textContent = 'UP'; $health.className = 'pill ok';
      $tls.textContent = j.data.tls ? 'mTLS ON' : 'HTTP'; $tls.className = 'pill';
    } else { $health.textContent = 'DOWN'; $health.className = 'pill err'; }
  } catch { $health.textContent = 'DOWN'; $health.className = 'pill err'; }
}

document.getElementById('refresh').addEventListener('click', async () => {
  await loadAccounts();
  await loadPendingVerifications();
});
document.getElementById('clearLog').addEventListener('click', () => { $log.innerHTML = ''; });

// 테마
const $theme = document.getElementById('themeToggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $theme.textContent = t === 'dark' ? '☀️' : '🌙';
}
const saved = localStorage.getItem('theme');
applyTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$theme.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

checkHealth();
loadAccounts();
loadPendingVerifications();
</script>
