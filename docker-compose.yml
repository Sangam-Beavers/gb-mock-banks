services:
  mock-bank:
    build:
      context: .
      dockerfile: Dockerfile
    image: gb-mock-banks:latest
    container_name: gb-mock-banks
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "4000:4000"
    # .env 파일을 먼저 만들어두세요:  cp .env.example .env
    env_file:
      - .env
    volumes:
      # 호스트의 SQLite 장부 (예제 데이터 포함) — 컨테이너에서 그대로 사용
      - ./data:/app/data
      # mTLS 인증서 (TLS_ENABLED=true 일 때만 사용)
      - ./certs:/app/certs:ro
